<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CleanCity AI — Smart Municipal Waste Management{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
    <meta name="description" content="CleanCity AI: Next-generation AI waste detection, smart GPS collection dispatch, and municipal analytics platform." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      :root {
        --font-primary: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --font-heading: 'Outfit', system-ui, -apple-system, sans-serif;
        --bg-main: #f8fafc;
        --bg-card: rgba(255, 255, 255, 0.94);
        --primary: #10b981;
        --primary-dark: #059669;
        --primary-light: #d1fae5;
        --primary-gradient: linear-gradient(135deg, #10b981 0%, #047857 100%);
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-light: #e2e8f0;
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 10px 25px -3px rgba(15, 23, 42, 0.07);
        --shadow-lg: 0 20px 35px -5px rgba(15, 23, 42, 0.1);
        --shadow-glow: 0 8px 25px rgba(16, 185, 129, 0.25);
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-full: 9999px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-primary); }
      body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; position: relative; overflow-x: hidden; }
      .background-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
      .glow-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.45; }
      .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, transparent 70%); top: -100px; right: -50px; }
      .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%); bottom: -150px; left: -100px; }
      .page-shell { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; position: relative; z-index: 1; }
      h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
      h1 { font-size: 2.3rem; } h2 { font-size: 1.8rem; } h3 { font-size: 1.35rem; }
      p { line-height: 1.6; color: var(--text-muted); }
      .muted { color: var(--text-muted); }
      .card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.9); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 28px; transition: transform 0.2s, box-shadow 0.2s; }
      .card:hover { box-shadow: var(--shadow-lg); }
      .topbar { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 16px 24px; margin-bottom: 28px; box-shadow: var(--shadow-sm); }
      .logo-row { display: flex; align-items: center; gap: 12px; }
      .logo-icon { font-size: 2rem; background: var(--primary-light); width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); }
      .link-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: var(--radius-full); font-weight: 600; font-size: 0.9rem; text-decoration: none; background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-light); transition: all 0.2s; }
      .link-btn:hover { background: #e2e8f0; transform: translateY(-1px); }
      form { display: flex; flex-direction: column; gap: 14px; }
      label { font-size: 0.9rem; font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; }
      input, select, textarea { width: 100%; background: #ffffff; border: 1.5px solid var(--border-light); border-radius: var(--radius-md); padding: 12px 16px; font-size: 0.95rem; color: var(--text-main); transition: all 0.2s; outline: none; }
      input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
      button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary-gradient); color: white; border: none; padding: 12px 22px; border-radius: var(--radius-md); font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25); }
      button:hover { filter: brightness(1.05); transform: translateY(-1.5px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35); }
      button.secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-light); box-shadow: none; }
      button.secondary:hover { background: #e2e8f0; }
      .alert { padding: 14px 18px; border-radius: var(--radius-md); font-size: 0.92rem; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
      .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
      .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
      .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
      .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
      .stat-card, .stats-grid .stat-box { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 20px 18px; text-align: center; box-shadow: var(--shadow-sm); transition: all 0.2s; }
      .stat-card:hover, .stats-grid .stat-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(16, 185, 129, 0.4); }
      .stat-card .stat-val, .stats-grid .stat-box strong { display: block; font-family: var(--font-heading); font-size: 2.1rem; font-weight: 800; color: var(--primary-dark); line-height: 1.2; margin-top: 4px; }
      .stat-card .stat-label, .stats-grid .stat-box span { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
      .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 700; text-transform: capitalize; }
      .status-pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
      .status-assigned { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
      .status-in-progress { background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
      .status-cleaned, .status-verified { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
      .status-pill { padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.78rem; font-weight: 700; }
      .mini-map { height: 220px; width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-light); margin-top: 10px; }
      .map-full { height: 420px; width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--border-light); margin: 14px 0 28px; box-shadow: var(--shadow-md); }
      .layout-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 28px; }
      .cards-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; margin-top: 18px; }
      .task-card { display: flex; flex-direction: column; justify-content: space-between; border-radius: var(--radius-lg); background: var(--bg-card); box-shadow: var(--shadow-md); border: 1px solid var(--border-light); padding: 24px; }
      .task-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(16, 185, 129, 0.4); }
      .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
      .badge { background: #f1f5f9; color: var(--text-main); font-weight: 800; font-size: 0.82rem; padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
      .task-photo { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 14px; border: 1px solid var(--border-light); }
      .task-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
      .complete-form { border-top: 1px dashed var(--border-light); padding-top: 14px; }
      table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 14px; }
      th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.92rem; }
      th { background: #f8fafc; color: var(--text-muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
      .photo-cell img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
      @media (max-width: 900px) { .layout-grid { grid-template-columns: 1fr; } .topbar { flex-direction: column; align-items: flex-start; gap: 14px; } }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="background-decorations">
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
    </div>
    {% block content %}{% endblock %}
  </body>
</html>
